<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ravnica Encounter Generator - D&D 5e</title>
    <meta name="description" content="Generate random encounters themed for D&D 5e in Ravnica" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet" />
    <!-- Custom elements for stat blocks -->
    <script type="module" src="js/stat-block.js"></script>
    <script type="module" src="js/creature-heading.js"></script>
    <script type="module" src="js/top-stats.js"></script>
    <script type="module" src="js/abilities-block.js"></script>
    <script type="module" src="js/property-line.js"></script>
    <script type="module" src="js/property-block.js"></script>
    <script type="module" src="js/tapered-rule.js"></script>
    <style>
        body {
            background: #090d16;
            color: #bcc8e0;
            overflow: visible;
            font-family: 'Noto Sans', sans-serif;
        }

        body { font-family: 'Noto Sans', sans-serif; }
        .statblock-expand stat-block { color: black; }

        .encounters-header {
            background: linear-gradient(135deg, #140826 0%, #0f1e3d 100%);
            border-bottom: 1px solid rgba(139,92,246,0.35);
            color: white;
            padding: 16px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .encounters-header h1 {
            margin: 0;
            font-size: 1.8em;
            background: linear-gradient(90deg, #e0d0ff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .encounters-header p {
            margin: 4px 0 0 0;
            font-size: 0.95em;
            color: #9a8acc;
        }
        
        .back-btn {
            background: rgba(139,92,246,0.18);
            color: #d4b8ff;
            border: 1px solid rgba(139,92,246,0.35);
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .back-btn:hover { background: rgba(139,92,246,0.32); }

        .encounters-container {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 150px);
            padding: 20px;
            gap: 20px;
        }

        .encounter-panel {
            background: rgba(139,92,246,0.06);
            border: 1px solid rgba(139,92,246,0.22);
            border-radius: 8px;
            padding: 22px;
        }

        .encounter-panel h2 {
            margin-top: 0;
            color: #a78bfa;
            font-size: 1.3em;
            border-bottom: 1px solid rgba(139,92,246,0.3);
            padding-bottom: 10px;
        }

        .form-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
            color: #aaa;
            font-size: 0.95em;
        }

        .form-group select,
        .form-group input {
            padding: 10px 12px;
            background: #070a12;
            border: 1px solid #232b3e;
            border-radius: 6px;
            color: #bcc8e0;
            font-size: 0.95em;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        .form-group select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
            padding-right: 36px;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139,92,246,0.18);
        }

        .button-group {
            display: flex;
        }
        .statblock {
            margin-top: 10px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #5b21b6 0%, #4338ca 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            min-height: 44px;
        }
        button:hover { opacity: 0.88; }
        button:active { transform: scale(0.98); }
        button.secondary {
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.45);
        }

        .encounter-result {
            background: rgba(139,92,246,0.07);
            border-left: 4px solid #8b5cf6;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .encounter-result.visible {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .encounter-result h3 {
            margin-top: 0;
            color: #a78bfa;
            font-size: 1.2em;
        }

        .environment-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
            border-left: 3px solid #764ba2;
        }

        .environment-info strong {
            color: #aaa;
            display: block;
            margin-bottom: 8px;
        }

        .encounters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .encounter-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 4px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .encounter-card:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .encounter-card strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .encounter-card em {
            font-style: italic;
            color: #bbb;
            font-size: 0.95em;
        }

        .guild-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin: 4px 4px 4px 0;
        }

        .azorius { background: #cfe2ff; color: #003d82; }
        .dimir { background: #b5cce8; color: #002147; }
        .rakdos { background: #ffc1c1; color: #5a0000; }
        .golgari { background: #d4d4a8; color: #2a2a00; }
        .selesnya { background: #c8e6c9; color: #1b5e20; }
        .orzhov { background: #e8e8e8; color: #212121; }
        .izzet { background: #ffe0b2; color: #e65100; }
        .gruul { background: #c8e6c9; color: #1b5e20; }
        .boros { background: #ffccbc; color: #bf360c; }
        .simic { background: #b2dfdb; color: #00695c; }

        .difficulty-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }

        .difficulty-trivial { background: #4caf50; color: white; }
        .difficulty-easy { background: #8bc34a; color: white; }
        .difficulty-medium { background: #ffc107; color: #333; }
        .difficulty-hard { background: #ff9800; color: white; }
        .difficulty-deadly { background: #f44336; color: white; }

        @media (max-width: 768px) {
            .encounters-header h1 { font-size: 1.8em; }
            .encounters-container { padding: 12px; }
            .encounter-panel { padding: 15px; }
            .encounters-grid { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="encounters-header">
        <h1>Ravnica Encounter Generator</h1>
        <p>Generate thematic encounters for your D&D 5e campaigns in Ravnica</p>
        <button class="back-btn" onclick="window.location.href='../index.html'" title="Back to Creatures">📖 View Creatures</button>
    </div>

    <div class="encounters-container">
        <div class="encounter-panel">
            <h2>⚙️ Encounter Configuration</h2>
            
            <div class="form-group">
                <label for="environment">🏙️ Environment</label>
                <select id="environment">
                    <option value="">-- Select an environment --</option>
                    <option value="azorius">🏛️ Azorius Administrative District</option>
                    <option value="orzhov">⛪ Orzhov Cathedral</option>
                    <option value="izzet">🧪 Izzet Laboratory</option>
                    <option value="rakdos">🎭 Rakdos Arena</option>
                    <option value="selesnya">🌳 Selesnya Garden</option>
                    <option value="golgari">☠️ Golgari Catacombs</option>
                    <option value="simic">🧬 Simic Zones</option>
                    <option value="gruul">🪨 Gruul Territory</option>
                    <option value="boros">Boros Garrison</option>
                    <option value="dimir">🕵️ Dimir Cell</option>
                    <option value="random">🎲 Random</option>
                </select>
            </div>

            <div class="form-group">
                <label for="partySize">Party Size</label>
                <input type="number" id="partySize" min="1" max="10" value="4" />
            </div>

            <div class="form-group">
                <label for="partyLevel">Party Level</label>
                <input type="number" id="partyLevel" min="1" max="20" value="1" />
            </div>

            <div class="form-group">
                <label for="difficulty">Desired Difficulty</label>
                <select id="difficulty">
                    <option value="random">🎲 Random</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                    <option value="deadly">Deadly</option>
                </select>
            </div>

            <div class="button-group">
                <button onclick="generateEncounter()">🎲 Generate Encounter</button>
                <button class="secondary" onclick="openCreaturesTab()">📖 View Creatures</button>
            </div>
        </div>

        <div class="encounter-result" id="encounterResult">
            <h3 id="encounterTitle">Generated Encounter</h3>
            <div id="encounterContent"></div>
        </div>
    </div>

    <script src="js/encounters.js"></script>
</body>
</html>
